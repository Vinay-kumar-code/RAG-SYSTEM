<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Assistant</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24 }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <!-- Top Bar -->
  <header class="sticky top-0 z-10 bg-white border-b border-slate-200/80">
    <div class="mx-auto max-w-7xl px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-indigo-600">dataset_linked</span>
        <h1 class="text-base font-semibold">RAG Assistant</h1>
      </div>
      <div id="status" class="text-sm text-slate-500"></div>
    </div>
  </header>

  <div class="mx-auto max-w-7xl px-4 py-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
    <!-- Sidebar -->
    <aside class="lg:col-span-4 xl:col-span-3 bg-white rounded-xl border border-slate-200 shadow-sm p-4 space-y-4">
      <!-- Create Store -->
      <details class="group" open>
        <summary class="flex items-center justify-between cursor-pointer select-none">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-slate-500">library_add</span>
            <span class="font-medium">Create RAG Store</span>
          </div>
          <span class="material-symbols-outlined text-slate-400 group-open:rotate-180 transition-transform">expand_more</span>
        </summary>
        <form id="build-form" class="mt-3 space-y-3">
          <label class="block text-sm">
            <span class="text-slate-700">Store ID</span>
            <input name="store_id" type="text" placeholder="my_store" required class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">File (PDF/TXT/CSV/XLSX)</span>
            <input name="file" type="file" accept=".pdf,.txt,.csv,.xlsx" required class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          </label>
          <label class="block text-sm">
            <span class="text-slate-700">Embedding model</span>
            <input name="embedding_model" type="text" value="nomic-embed-text" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          </label>
          <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-indigo-600 text-white px-4 py-2 text-sm font-semibold hover:bg-indigo-500">
            <span class="material-symbols-outlined" style="font-size: 18px;">build</span>
            Build
          </button>
        </form>
      </details>

      <!-- Controls -->
      <div class="space-y-3">
        <label class="block text-sm">
          <span class="text-slate-700">Store</span>
          <select id="store-select" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></select>
        </label>
        <label class="block text-sm">
          <span class="text-slate-700">Model</span>
          <select id="model-select" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></select>
        </label>
        <label class="block text-sm">
          <span class="text-slate-700">Top-K</span>
          <input id="topk" type="number" min="1" max="20" value="4" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
        </label>
      </div>

      <!-- Semantic Search -->
      <div class="bg-slate-50 rounded-lg p-3 border border-slate-200">
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
          <input id="search-input" type="text" placeholder="Semantic search in selected store" class="pl-10 pr-28 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          <button id="search-btn" class="absolute right-1 top-1/2 -translate-y-1/2 px-3 py-1.5 rounded-md bg-indigo-600 text-white text-xs font-medium hover:bg-indigo-500" title="Search">Search</button>
        </div>
      </div>
    </aside>

    <!-- Main Column -->
    <section class="lg:col-span-8 xl:col-span-9 space-y-4">
      <!-- Chat Card -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <div class="p-4 border-b border-slate-200 flex items-center justify-between">
          <div class="flex items-center gap-2 text-slate-500 text-sm">
            <span class="material-symbols-outlined">forum</span>
            <span>Chat</span>
          </div>
        </div>
        <div id="chat-window" class="min-h-[420px] max-h-[60vh] overflow-y-auto p-4 bg-slate-50"></div>
        <form id="chat-form" class="p-4 flex items-center gap-2 border-t border-slate-200">
          <input id="question" type="text" placeholder="Ask a question..." required class="flex-1 rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          <button type="submit" class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 text-white px-4 py-2 text-sm font-semibold hover:bg-indigo-500">
            <span class="material-symbols-outlined" style="font-size: 18px;">send</span>
            Send
          </button>
          <button id="export-btn" type="button" class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white text-slate-700 px-3 py-2 text-sm hover:bg-slate-50">
            <span class="material-symbols-outlined" style="font-size: 18px;">download</span>
            Export
          </button>
        </form>
        <details id="error-box" class="px-4 pb-4" hidden>
          <summary class="text-sm text-rose-700 cursor-pointer">Error details</summary>
          <pre id="error-text" class="mt-2 text-xs bg-rose-50 text-rose-700 p-2 rounded border border-rose-200 overflow-auto"></pre>
        </details>
      </div>

      <!-- Sources Card -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
        <div class="p-4 border-b border-slate-200 flex items-center gap-2 text-slate-500 text-sm">
          <span class="material-symbols-outlined">menu_book</span>
          <h3 class="font-medium">Sources</h3>
        </div>
        <div id="sources" class="p-4 space-y-2"></div>
      </div>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
